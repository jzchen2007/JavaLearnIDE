<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:">
  <title>菲比桌宠</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <!-- 台词气泡 -->
  <div id="bubble" class="hidden">
    <div class="bubble-head">
      <span class="bubble-name">菲比</span>
      <span class="bubble-state" id="bubble-state">待机</span>
      <span class="bubble-spacer"></span>
      <button id="bubble-close" title="关闭气泡">✕</button>
    </div>
    <div id="bubble-text"></div>
  </div>

  <!-- 功能菜单 -->
  <div id="menu" class="hidden">
    <button class="menu-item" data-act="check">📋 检查代码</button>
    <button class="menu-item" data-act="compile">🛠 编译</button>
    <button class="menu-item" data-act="run">▶ 运行</button>
    <div class="menu-sep"></div>
    <button class="menu-item" data-act="hide">🙈 躲起来</button>
  </div>

  <!-- 菲比本体（占位 Q 版形象，后续可替换为同人立绘/动图） -->
  <div id="pet" class="idle" title="菲比（点击呼唤）">
    <svg class="pet-svg" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bodyGrad" cx="50%" cy="40%" r="65%">
          <stop offset="0%" stop-color="#fdf6ff"/>
          <stop offset="100%" stop-color="#e6d5f5"/>
        </radialGradient>
        <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffb3c8" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#ffb3c8" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <!-- 触角 -->
      <g class="antenna">
        <line x1="70" y1="52" x2="52" y2="22" stroke="#b9a0dd" stroke-width="5" stroke-linecap="round"/>
        <line x1="130" y1="52" x2="148" y2="22" stroke="#b9a0dd" stroke-width="5" stroke-linecap="round"/>
        <circle class="antenna-tip" cx="52" cy="20" r="8" fill="#c9b3f0"/>
        <circle class="antenna-tip" cx="148" cy="20" r="8" fill="#c9b3f0"/>
      </g>
      <!-- 身体 -->
      <ellipse class="pet-body-shape" cx="100" cy="120" rx="72" ry="78" fill="url(#bodyGrad)" stroke="#cfb8ec" stroke-width="3"/>
      <!-- 腮红 -->
      <circle cx="58" cy="138" r="14" fill="url(#blushGrad)"/>
      <circle cx="142" cy="138" r="14" fill="url(#blushGrad)"/>
      <!-- 眼睛 -->
      <g class="eyes">
        <ellipse class="eye" cx="74" cy="112" rx="11" ry="13" fill="#4a3b6b"/>
        <ellipse class="eye" cx="126" cy="112" rx="11" ry="13" fill="#4a3b6b"/>
        <circle class="eye-shine" cx="78" cy="107" r="4" fill="#fff"/>
        <circle class="eye-shine" cx="130" cy="107" r="4" fill="#fff"/>
      </g>
      <!-- 嘴巴 -->
      <path class="mouth" d="M92 146 Q100 154 108 146" stroke="#a98bc9" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- 小脚 -->
      <ellipse cx="72" cy="196" rx="16" ry="8" fill="#e6d5f5" stroke="#cfb8ec" stroke-width="2"/>
      <ellipse cx="128" cy="196" rx="16" ry="8" fill="#e6d5f5" stroke="#cfb8ec" stroke-width="2"/>
      <!-- 工作状态小道具 -->
      <g class="sweat hidden-prop">
        <path d="M46 78 q-8 10 0 16 q8 -6 0 -16z" fill="#8fd3ff"/>
      </g>
      <g class="sparkle hidden-prop">
        <text x="160" y="60" font-size="18">✨</text>
        <text x="30" y="90" font-size="14">✨</text>
      </g>
      <g class="tear hidden-prop">
        <ellipse cx="56" cy="150" rx="4" ry="7" fill="#8fd3ff"/>
      </g>
    </svg>
  </div>

  <script src="pet.js"></script>
</body>
</html>
